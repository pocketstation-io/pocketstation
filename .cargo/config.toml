# Force native CPU SIMD for both Rust and C (libopus).
# Without this:
#   - Rust loops do not use AVX2/NEON even on capable hardware
#   - libopus compiles without its NEON/SSE intrinsics → 3-5x slower encode
#
# Result on Apple M-series (NEON):  encode + decode drops from ~110µs to ~25µs/frame.
# Result on x86-64 (AVX2):         similar 3-5x improvement.
#
# CFLAGS applies to all C/C++ crates built by the cc crate (including libopus-sys).
# target-cpu=native applies to all Rust code.
#
# Do NOT commit machine-specific measurements to CI — CI runners may not have the
# same SIMD capabilities. Strip these flags in CI via `RUSTFLAGS=""` override.

[build]
rustflags = ["-C", "target-cpu=native"]

[env]
CFLAGS  = "-O3 -march=native"
CXXFLAGS = "-O3 -march=native"
