name: publish-rust-facade

'on':
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'release' &&
        github.event.release.prerelease == false &&
        startsWith(github.event.release.tag_name, 'pocketstation-v')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Require a version-matched release commit on main
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          workspace_version="$(
            cargo metadata --format-version 1 --no-deps |
              jq -r '.packages[] | select(.name == "pocketstation") | .version'
          )"
          expected_tag="pocketstation-v${workspace_version}"
          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "release tag ${RELEASE_TAG} must equal ${expected_tag}" >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
            echo "release tag does not resolve to the checked-out commit" >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "release commit is not contained in origin/main" >&2
            exit 1
          fi
          git diff --quiet
          git diff --cached --quiet

      - name: Install Linux audio system deps (PipeWire + ALSA)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libasound2-dev \
            libpipewire-0.3-dev \
            pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Workspace tests
        run: cargo test --workspace --all-features --locked

      - name: Strict workspace Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Compile the public quickstart
        run: cargo build --release -p pocketstation --example product_quickstart --locked

      - name: Architecture constraints
        run: bash scripts/lint/check-architecture-constraints.sh

      - name: CODE_PROTOCOL
        run: bash scripts/check_protocol.sh

      - name: Validate the exact crates.io facade closure
        run: bash scripts/publish.sh --dry-run

  publish:
    if: >-
      github.event_name == 'release' &&
      github.event.release.prerelease == false &&
      startsWith(github.event.release.tag_name, 'pocketstation-v')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux audio system deps (PipeWire + ALSA)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libasound2-dev \
            libpipewire-0.3-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish the verified facade closure in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish.sh
