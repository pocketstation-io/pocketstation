name: publish-rust-facade

'on':
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version-matched release tag to resume
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'release' &&
        github.event.release.prerelease == false &&
        startsWith(github.event.release.tag_name, 'pocketstation-v')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt

      - name: Require a version-matched release and guarded main recovery
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          workspace_version="$(
            cargo metadata --format-version 1 --no-deps |
              jq -r '.packages[] | select(.name == "pocketstation") | .version'
          )"
          expected_tag="pocketstation-v${workspace_version}"
          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "release tag ${RELEASE_TAG} must equal ${expected_tag}" >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          git fetch origin main
          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "release commit is not contained in origin/main" >&2
            exit 1
          fi
          if [[ "${EVENT_NAME}" == "release" ]]; then
            if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
              echo "release tag does not resolve to the checked-out commit" >&2
              exit 1
            fi
          else
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "publication recovery must run from main" >&2
              exit 1
            fi
            if [[ "${GITHUB_SHA}" != "$(git rev-parse origin/main)" ]]; then
              echo "publication recovery is not the current origin/main" >&2
              exit 1
            fi
            unexpected_paths="$(
              git diff --name-only "${tag_commit}..${GITHUB_SHA}" |
              grep -Ev '^(\.github/workflows/publish\.yml|README\.md|docs/getting-started/rust-quickstart\.md|PHASE2_PROGRESS\.md|scripts/publish\.sh|scripts/test-publish-recovery\.sh|scripts/fixtures/connector-v1-vectors\.json)$' ||
                true
            )"
            if [[ -n "${unexpected_paths}" ]]; then
              echo "publication recovery contains package or product drift:" >&2
              echo "${unexpected_paths}" >&2
              exit 1
            fi
          fi
          git diff --quiet
          git diff --cached --quiet

      - name: Install Linux audio system deps (PipeWire + ALSA)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libasound2-dev \
            libpipewire-0.3-dev \
            pkg-config \
            ripgrep

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Materialize the connector conformance corpus
        run: |
          mkdir -p ../protocol/conformance/connector/v1
          cp scripts/fixtures/connector-v1-vectors.json \
            ../protocol/conformance/connector/v1/vectors.json

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Workspace tests
        run: cargo test --workspace --all-features --locked

      - name: Strict workspace Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Cross-document public facade on the configured docs.rs target
        run: cargo doc --locked --no-deps -p pocketstation --no-default-features --target x86_64-unknown-linux-gnu

      - name: Compile the public quickstart
        run: cargo build --release -p pocketstation --example quickstart --locked

      - name: Architecture constraints
        run: bash scripts/lint/check-architecture-constraints.sh

      - name: CODE_PROTOCOL
        run: bash scripts/check_protocol.sh

      - name: Validate the exact crates.io facade closure
        run: bash scripts/publish.sh --dry-run

      - name: Validate idempotent publication recovery
        run: bash scripts/test-publish-recovery.sh

  validate-platforms:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'release' &&
        github.event.release.prerelease == false &&
        startsWith(github.event.release.tag_name, 'pocketstation-v')
      )
    name: release library / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0

      - name: Install Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Install CMake 3.31 for bundled libopus
        run: python -m pip install --disable-pip-version-check "cmake==3.31.6"

      - name: Compile the default native capture library
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          ninja --version
          cargo check --release --locked -p pocketstation

  publish:
    if: >-
      (
        github.event_name == 'release' &&
        github.event.release.prerelease == false &&
        startsWith(github.event.release.tag_name, 'pocketstation-v')
      ) ||
      github.event_name == 'workflow_dispatch'
    needs: [validate, validate-platforms]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: crates-io
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Install Linux audio system deps (PipeWire + ALSA)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libasound2-dev \
            libpipewire-0.3-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      # Keep the crates.io credential scoped to the protected release
      # environment until this package uses trusted publishing.
      - name: Publish the verified facade closure in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish.sh
