name: ci-rust-audio-core
# Run on PRs, and on push only to main (post-merge). The previous
# `on: [pull_request, push]` ran every check TWICE on a PR branch (once for the
# push event, once for the pull_request event) — wasteful and noisy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Linux capture backend depends on PipeWire (libspa-sys), whose build
      # script needs the PipeWire dev headers + pkg-config, and bindgen needs
      # libclang. Without these the workspace fails to build on Linux — which is
      # why CI was red before this step existed.
      - name: Install Linux audio system deps (PipeWire + ALSA)
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libasound2-dev pkg-config clang
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Compile benchmarks
        run: cargo bench --no-run -p pks-audio
      - name: Alloc-free hot path check (integration test)
        run: cargo test -p pks-audio --test alloc_check -- --nocapture
      # Publish dry-run removed: it was guarded by `|| true` (could never fail =
      # meaningless), and real publishing is handled by publish.yml.
