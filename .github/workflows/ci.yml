name: rust-facade-ci

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-facade-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux audio system deps (PipeWire + ALSA)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libasound2-dev \
            libpipewire-0.3-dev \
            pkg-config \
            ripgrep

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Workspace tests
        run: cargo test --workspace --all-features --locked

      - name: Strict workspace Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Compile the public quickstart
        run: cargo build --release -p pocketstation --example product_quickstart --locked

      - name: Architecture constraints
        run: bash scripts/lint/check-architecture-constraints.sh

      - name: CODE_PROTOCOL
        run: bash scripts/check_protocol.sh

      - name: Validate the exact crates.io facade closure
        run: bash scripts/publish.sh --dry-run
