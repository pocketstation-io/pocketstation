name: rust-facade-ci

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-facade-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install Linux audio system deps (PipeWire + ALSA)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libasound2-dev \
            libpipewire-0.3-dev \
            pkg-config \
            ripgrep

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Workspace tests
        run: cargo test --workspace --all-features --locked

      - name: Strict workspace Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Cross-document public facade on the configured docs.rs target
        run: cargo doc --locked --no-deps -p pocketstation --no-default-features --target x86_64-unknown-linux-gnu

      - name: Verify capture-only dependencies exclude Opus
        run: |
          if cargo tree --locked -e normal -p pocketstation \
            --no-default-features --features native-capture --prefix none | \
            grep -E '^(opus|audiopus_sys) v'; then
            echo "capture-only builds must not include Opus" >&2
            exit 1
          fi

      - name: Compile the public quickstart
        run: cargo build --release -p pocketstation --example quickstart --locked

      - name: Architecture constraints
        run: bash scripts/lint/check-architecture-constraints.sh

      - name: CODE_PROTOCOL
        run: bash scripts/check_protocol.sh

      - name: Validate the exact crates.io facade closure
        run: bash scripts/publish.sh --dry-run

  native-platforms:
    name: release library / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0

      - name: Install Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Install CMake 3.31 for bundled libopus
        run: python -m pip install --disable-pip-version-check "cmake==3.31.6"

      - name: Compile the default native capture library
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          ninja --version
          cargo check --release --locked -p pocketstation

      - name: Link the capture-only debug library without Opus
        run: cargo build --locked -p pocketstation --no-default-features --features native-capture
