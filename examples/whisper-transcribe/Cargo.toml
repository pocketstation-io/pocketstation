[package]
name = "whisper-transcribe-example"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.pocketstation]
registry-role = "example"

[dependencies]
hound = "3"
pocketstation = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "time"] }

[dev-dependencies]
