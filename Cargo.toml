[workspace]
resolver = "2"
members = [
  "crates/pks-frame",
  "crates/pks-timing",
  "crates/pks-caps",
  "crates/pks-codec",
  "crates/pks-codec-c",
  "crates/pks-metrics",
  "crates/pks-runtime",
  "crates/pks-endpoint",
  "crates/pks-graph",
  "crates/pks-dsp",
  "crates/pks-nodes",
  "crates/pks-session",
  "crates/pks-session-c",
  "crates/pks-capture",
  "crates/pks-capture-macos",
  "crates/pks-capture-windows",
  "crates/pks-capture-linux",
  "crates/pks-audio",
  "examples/whisper-transcribe",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pocketstation-io/pocketstation"

[workspace.dependencies]
pks-timing = { path = "crates/pks-timing" }
rtrb = "0.3"
thiserror = "1"
hound = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
opus = "0.3"
proptest = "1"
criterion = "0.5"
assert_no_alloc = { version = "1.1", default-features = false }
cpal = "0.18.1"

# Production release: full LTO + single codegen unit so LLVM can inline
# across crate boundaries (Rust → libopus FFI call sites) and vectorize.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Bench profile inherits release but keeps debug symbols for profiling.
[profile.bench]
inherits = "release"
debug = true
