[package]
name = "pocketstation"
version = "1.0.1"
edition = "2021"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pocketstation-io/pocketstation"
homepage = "https://github.com/pocketstation-io/pocketstation"
documentation = "https://docs.rs/pocketstation"
description = "Source-aware desktop audio Session SDK"
readme = "README.md"
keywords = ["audio", "capture", "realtime", "session", "webrtc"]
categories = ["multimedia::audio", "api-bindings"]
include = [
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/RELEASE_NOTES_1.0.0.md",
  "/RELEASE_NOTES_1.0.1.md",
  "/build.rs",
  "/docs/README.md",
  "/docs/architecture/overview.md",
  "/docs/concepts/signals-and-streams.md",
  "/docs/development/compatibility-and-freeze.md",
  "/docs/getting-started/rust-quickstart.md",
  "/docs/guides/extensions.md",
  "/src/**",
  "/native/**",
  "/include/**",
  "/examples/product_quickstart.rs",
  "/tests/**",
  "/benches/**",
  "/proptest-regressions/**",
]

[package.metadata.pocketstation]
registry-role = "public-product"

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
no-default-features = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["native-capture"]
native-capture = [
  "dep:cpal",
  "dep:pipewire",
  "dep:alsa",
  "dep:libc",
  "dep:wasapi",
  "dep:windows",
  "dep:windows-core",
]
conformance-fixtures = []
internal-testing = []
macos-asp-driver-artifact = []

[dependencies]
rtrb = "0.3"
thiserror = "1"
hound = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
opus = "0.3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
proptest = "1"
criterion = "0.5"
assert_no_alloc = { version = "1.1", default-features = false }
tempfile = "3"

[build-dependencies]
cc = "1"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = { version = "0.18.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10", optional = true }
alsa = { version = "0.11", optional = true }
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = { version = "0.23", optional = true }
windows = { version = "0.58", optional = true, features = [
  "implement",
  "Win32_Media",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_System_Variant",
  "Win32_Foundation",
] }
windows-core = { version = "0.58", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true

[[bench]]
name = "audio_buffer_pool"
harness = false
required-features = ["internal-testing"]

[[bench]]
name = "capture_to_stream"
harness = false
required-features = ["internal-testing"]

[[bench]]
name = "captured_frame_stream"
harness = false
required-features = ["internal-testing"]

[[bench]]
name = "opus_decode"
harness = false
required-features = ["internal-testing"]

[[bench]]
name = "opus_encode"
harness = false
required-features = ["internal-testing"]

[[bench]]
name = "typed_edge"
harness = false
required-features = ["internal-testing"]

[[bench]]
name = "runtime_plan"
harness = false
required-features = ["internal-testing"]

[[bench]]
name = "generated_audio_bridge"
harness = false
required-features = ["internal-testing"]

[[bench]]
name = "session_lifecycle"
harness = false
required-features = ["conformance-fixtures"]

[[bench]]
name = "timing"
harness = false
required-features = ["internal-testing"]

[[test]]
name = "codec_hot_path_alloc"
required-features = ["internal-testing"]

[[test]]
name = "capture_hot_path_alloc"
required-features = ["internal-testing"]

[[test]]
name = "codec_opus_roundtrip"
required-features = ["internal-testing"]

[[test]]
name = "runtime_plan_router_alloc"
required-features = ["internal-testing"]
