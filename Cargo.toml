[workspace]
resolver = "2"
members = [
  "crates/pks-frame",
  "crates/pks-caps",
  "crates/pks-codec",
  "crates/pks-metrics",
  "crates/pks-pipeline",
  "crates/pks-runtime",
  "crates/pks-graph",
  "crates/pks-ml",
  "crates/pks-nodes",
  "crates/pks-capture",
  "crates/pks-capture-macos",
  "crates/pks-capture-windows",
  "crates/pks-capture-linux",
  "crates/pks-audio",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pocketstation-io/audio-core"

[workspace.dependencies]
media-clock = { path = "../media-clock/crates/media-clock" }
rtrb = "0.3"
thiserror = "1"
hound = "3"
opus = "0.3"
proptest = "1"
criterion = "0.5"
assert_no_alloc = "1.1"

# Production release: full LTO + single codegen unit so LLVM can inline
# across crate boundaries (Rust → libopus FFI call sites) and vectorize.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Bench profile inherits release but keeps debug symbols for profiling.
[profile.bench]
inherits = "release"
debug = true
