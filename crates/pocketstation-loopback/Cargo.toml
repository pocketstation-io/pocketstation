[package]
name = "pocketstation-loopback"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "System audio loopback capture for PocketStation (macOS ScreenCaptureKit, Linux PipeWire/ALSA, Windows WASAPI)"

[features]
asp = []   # opt-in; requires vendor/libASPL submodule (see asp/README.md)

[dependencies]
pocketstation-frame = { path = "../pocketstation-frame" }
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "7"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.10"
alsa = "0.9"

[build-dependencies]
cc = "1"

[dev-dependencies]
