[package]
name = "pocketstation-loopback"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "System audio loopback capture for PocketStation (macOS ScreenCaptureKit, Linux PipeWire/ALSA, Windows WASAPI)"

[dependencies]
pocketstation-frame = { path = "../pocketstation-frame" }
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.10"
alsa = "0.9"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.23"
windows = { version = "0.58", features = [
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_Foundation",
] }
windows-core = "0.58"

[build-dependencies]
cc = "1"

[dev-dependencies]
