[package]
name = "pks-capture-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Windows WASAPI loopback capture for PocketStation"

[package.metadata.pocketstation]
registry-role = "facade-dependency"

[dependencies]
pks-capture = { path = "../pks-capture", version = "0.1.0" }
pks-frame = { path = "../pks-frame", version = "0.1.0" }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.23"
rtrb = "0.3"
windows = { version = "0.58", features = [
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_Foundation",
] }
windows-core = "0.58"
