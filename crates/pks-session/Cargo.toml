[package]
name = "pks-session"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Session declaration and lifecycle composition for PocketStation"

[package.metadata.pocketstation]
registry-role = "facade-dependency"

[dependencies]
pks-caps = { path = "../pks-caps", version = "0.1.0" }
pks-capture = { path = "../pks-capture", version = "0.1.0" }
pks-endpoint = { path = "../pks-endpoint", version = "0.1.1" }
pks-frame = { path = "../pks-frame", version = "0.1.0" }
pks-graph = { path = "../pks-graph", version = "0.1.0" }
pks-recording = { path = "../pks-recording", version = "0.1.0" }
pks-runtime = { path = "../pks-runtime", version = "0.1.0" }
pks-timing = { path = "../pks-timing", version = "0.1.0" }
rtrb.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
pks-capture-macos = { path = "../pks-capture-macos", version = "0.1.0" }

[target.'cfg(target_os = "linux")'.dependencies]
pks-capture-linux = { path = "../pks-capture-linux", version = "0.1.0" }

[target.'cfg(target_os = "windows")'.dependencies]
pks-capture-windows = { path = "../pks-capture-windows", version = "0.1.0" }
