[package]
name = "pocketstation-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
real-opus = ["pocketstation-codec/real-opus"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[example]]
name = "sine_to_wav"
# cargo run -p pocketstation-audio --example sine_to_wav

[[example]]
name = "soak"
# cargo run -p pocketstation-audio --example soak

[dependencies]
pocketstation-frame = { path = "../pocketstation-frame", version = "0.1.0" }
pocketstation-bus = { path = "../pocketstation-bus", version = "0.1.0" }
pocketstation-graph = { path = "../pocketstation-graph", version = "0.1.0" }
pocketstation-codec = { path = "../pocketstation-codec", version = "0.1.0" }
pocketstation-route = { path = "../pocketstation-route", version = "0.1.0" }
pocketstation-metrics = { path = "../pocketstation-metrics", version = "0.1.0" }
hound.workspace = true

[[test]]
name = "phase0_pipeline"
path = "../../tests/phase0_pipeline.rs"

[build-dependencies]
cbindgen = "0.27"
