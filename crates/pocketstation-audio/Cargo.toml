[package]
name = "pocketstation-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
real-opus = ["pocketstation-codec/real-opus"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[example]]
name = "sine_to_wav"
# cargo run -p pocketstation-audio --example sine_to_wav

[[example]]
name = "soak"
# cargo run -p pocketstation-audio --example soak

[dependencies]
pocketstation-frame = { path = "../pocketstation-frame", version = "0.1.0" }
pocketstation-pipeline = { path = "../pocketstation-pipeline", version = "0.1.0" }
pocketstation-codec = { path = "../pocketstation-codec", version = "0.1.0" }
pocketstation-capture = { path = "../pocketstation-capture", version = "0.1.0" }
pocketstation-capture-macos = { path = "../pocketstation-capture-macos", version = "0.1.0" }
pocketstation-capture-windows = { path = "../pocketstation-capture-windows", version = "0.1.0" }
pocketstation-capture-linux = { path = "../pocketstation-capture-linux", version = "0.1.0" }
pocketstation-metrics = { path = "../pocketstation-metrics", version = "0.1.0" }
hound.workspace = true

[[test]]
name = "phase0_pipeline"
path = "../../tests/phase0_pipeline.rs"

[build-dependencies]
cbindgen = "0.27"

[dev-dependencies]
criterion = { workspace = true }
assert_no_alloc = { workspace = true }

[[bench]]
name = "encode_bench"
harness = false
path = "../../benches/encode_bench.rs"

[[bench]]
name = "decode_bench"
harness = false
path = "../../benches/decode_bench.rs"

[[bench]]
name = "pool_bench"
harness = false
path = "../../benches/pool_bench.rs"

[[bench]]
name = "bus_bench"
harness = false
path = "../../benches/bus_bench.rs"
