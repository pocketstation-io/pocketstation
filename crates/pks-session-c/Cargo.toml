[package]
name = "pks-session-c"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Stable C projection of the PocketStation Session lifecycle"
publish = false

[package.metadata.pocketstation]
registry-role = "deferred"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
conformance-fixtures = [
    "dep:pks-capture",
    "dep:pks-frame",
    "dep:pks-graph",
]

[dependencies]
pks-capture = { path = "../pks-capture", version = "0.1.0", optional = true }
pks-frame = { path = "../pks-frame", version = "0.1.0", optional = true }
pks-graph = { path = "../pks-graph", version = "0.1.0", optional = true }
pks-session = { path = "../pks-session", version = "0.1.0" }
thiserror.workspace = true

[dev-dependencies]
pks-capture = { path = "../pks-capture", version = "0.1.0" }
pks-frame = { path = "../pks-frame", version = "0.1.0" }
pks-graph = { path = "../pks-graph", version = "0.1.0" }
