[package]
name = "pocketstation-capture-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Windows WASAPI loopback capture for PocketStation"

[dependencies]
pocketstation-capture = { path = "../pocketstation-capture", version = "0.1.0" }
pocketstation-frame = { path = "../pocketstation-frame", version = "0.1.0" }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.23"
windows = { version = "0.58", features = [
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_Foundation",
] }
windows-core = "0.58"
