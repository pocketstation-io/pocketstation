[package]
name = "pks-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
real-opus = ["pks-codec/real-opus"]

[[example]]
name = "holy_shit_demo"
# cargo run -p pks-audio --example holy_shit_demo

[[example]]
name = "sine_to_wav"
# cargo run -p pks-audio --example sine_to_wav

[[example]]
name = "soak"
# cargo run -p pks-audio --example soak

[[example]]
name = "product_quickstart"
# cargo run -p pks-audio --example product_quickstart

[[example]]
name = "product_proof_local"
# cargo run -p pks-audio --example product_proof_local -- --duration-seconds 300 --output <path> --cell normal

[dependencies]
pks-frame = { path = "../pks-frame", version = "0.1.0" }
pks-caps = { path = "../pks-caps", version = "0.1.0" }
pks-timing = { path = "../pks-timing", version = "0.1.0" }
pks-graph = { path = "../pks-graph", version = "0.1.0" }
pks-runtime = { path = "../pks-runtime", version = "0.1.0" }
pks-session = { path = "../pks-session", version = "0.1.0" }
pks-nodes = { path = "../pks-nodes", version = "0.1.0" }
pks-codec = { path = "../pks-codec", version = "0.1.0" }
pks-capture = { path = "../pks-capture", version = "0.1.0" }
pks-capture-macos = { path = "../pks-capture-macos", version = "0.1.0" }
pks-capture-windows = { path = "../pks-capture-windows", version = "0.1.0" }
pks-capture-linux = { path = "../pks-capture-linux", version = "0.1.0" }
pks-metrics = { path = "../pks-metrics", version = "0.1.0" }
hound.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion = { workspace = true }
assert_no_alloc = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
